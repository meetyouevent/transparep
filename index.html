<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TranspaRép</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300;1,9..144,600&family=Cabinet+Grotesk:wght@400;500;700;800&family=DM+Mono:wght@400;500&display=swap');

/* ═══════════════════════════════════════════
   TOKENS
═══════════════════════════════════════════ */
:root {
  --ink:    #06101d;
  --deep:   #091525;
  --mid:    #0e2040;
  --lift:   #152e58;
  --glass:  rgba(14,32,64,0.7);
  --rim:    rgba(255,255,255,0.08);
  --rim+:   rgba(255,255,255,0.14);
  --text:   #e6eeff;
  --soft:   rgba(230,238,255,0.5);
  --ghost:  rgba(230,238,255,0.22);
  --gold:   #f0b429;
  --gold+:  #ffd166;
  --ember:  #ff6b6b;
  --sage:   #3ecf8e;
  --sky:    #5b9cf6;
  --peach:  #ff8c5a;

  /* Palette — each slice category */
  --c1:#e05c5c; --c2:#e8874d; --c3:#d4a017; --c4:#7eb87e; --c5:#4a90d9; --c6:#9b72cf; --c7:#5fb8b0;
}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{background:var(--ink);height:100%;}
body{
  font-family:'Cabinet Grotesk',sans-serif;
  background:var(--ink);color:var(--text);
  height:100svh;display:flex;flex-direction:column;
  overflow:hidden;
}

/* ═══════════════════════════════════════════
   AMBIENT BACKGROUND — always visible
═══════════════════════════════════════════ */
.amb{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 90% 60% at 50% 40%, rgba(91,156,246,0.07) 0%, transparent 65%),
    radial-gradient(ellipse 50% 40% at 15% 85%, rgba(240,180,41,0.05) 0%, transparent 55%),
    radial-gradient(ellipse 45% 35% at 88% 12%, rgba(62,207,142,0.04) 0%, transparent 50%);
  animation:amb-drift 18s ease-in-out infinite alternate;
}
@keyframes amb-drift{
  0%{opacity:.8;transform:scale(1);}
  100%{opacity:1;transform:scale(1.06) translate(1%,1%);}
}

/* ═══════════════════════════════════════════
   TOP BAR — ultra minimal, floating
═══════════════════════════════════════════ */
.topbar{
  position:relative;z-index:50;
  padding:env(safe-area-inset-top,0px) 20px 0;
  display:flex;align-items:center;gap:12px;
  height:calc(54px + env(safe-area-inset-top,0px));
  flex-shrink:0;
}
.wordmark{
  font-family:'Fraunces',serif;
  font-size:1.15rem;font-weight:600;
  font-style:italic;letter-spacing:-0.01em;
  color:var(--text);flex-shrink:0;
  cursor:pointer;
  transition:opacity .2s;
}
.wordmark:active{opacity:.6;}
.wordmark em{color:var(--gold);font-style:normal;}

/* Search pill — expands on tap */
.search-pill{
  flex:1;position:relative;
}
.sp-btn{
  width:100%;height:38px;
  background:var(--glass);
  border:1px solid var(--rim+);
  border-radius:19px;
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  display:flex;align-items:center;gap:8px;
  padding:0 14px;cursor:pointer;
  transition:all .25s cubic-bezier(0.34,1.2,0.64,1);
}
.sp-btn:hover{border-color:rgba(240,180,41,0.35);background:rgba(14,32,64,0.85);}
.sp-btn:active{transform:scale(0.97);}
.sp-icon{font-size:0.8rem;opacity:.5;flex-shrink:0;}
.sp-label{
  flex:1;font-size:0.8rem;font-weight:500;
  color:var(--ghost);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.sp-label.has-city{color:var(--text);font-weight:700;}
.sp-dept{
  font-family:'DM Mono',monospace;font-size:0.62rem;
  color:var(--gold);flex-shrink:0;
  background:rgba(240,180,41,0.12);
  border-radius:10px;padding:2px 7px;
}

/* Alert badge */
.alert-badge{
  flex-shrink:0;
  width:36px;height:36px;border-radius:50%;
  background:rgba(255,107,107,0.15);
  border:1px solid rgba(255,107,107,0.3);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .2s;
  position:relative;
}
.alert-badge:hover{background:rgba(255,107,107,0.25);}
.alert-badge:active{transform:scale(.92);}
.alert-badge-num{
  font-family:'DM Mono',monospace;
  font-size:0.65rem;font-weight:700;color:#ff9090;
}
.alert-dot{
  position:absolute;top:5px;right:5px;
  width:6px;height:6px;border-radius:50%;
  background:var(--ember);
  box-shadow:0 0 6px var(--ember);
  animation:pulse-dot 1.8s ease-in-out infinite;
}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.6);}}

/* ═══════════════════════════════════════════
   SEARCH OVERLAY — full screen modal
═══════════════════════════════════════════ */
.search-overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(6,16,29,0.96);
  backdrop-filter:blur(32px) saturate(200%);
  -webkit-backdrop-filter:blur(32px) saturate(200%);
  display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,20px) 20px 20px;
  opacity:0;pointer-events:none;
  transition:opacity .25s;
}
.search-overlay.open{opacity:1;pointer-events:all;}

.so-top{
  display:flex;align-items:center;gap:12px;
  margin-bottom:20px;
  margin-top:calc(env(safe-area-inset-top,0px) + 8px);
}
.so-input-wrap{
  flex:1;position:relative;
  display:flex;align-items:center;
  background:var(--mid);
  border:1.5px solid rgba(240,180,41,0.35);
  border-radius:16px;padding:0 14px;gap:10px;
  height:48px;
  box-shadow:0 0 0 4px rgba(240,180,41,0.08);
}
.so-input{
  flex:1;background:none;border:none;outline:none;
  font-family:'Cabinet Grotesk',sans-serif;
  font-size:1rem;font-weight:600;color:var(--text);
  caret-color:var(--gold);
}
.so-input::placeholder{color:var(--ghost);font-weight:400;}
.so-clear{
  background:none;border:none;color:var(--ghost);
  font-size:1.1rem;cursor:pointer;padding:0;
  opacity:0;transition:opacity .15s;flex-shrink:0;
}
.so-clear.vis{opacity:1;}
.so-cancel{
  flex-shrink:0;font-size:0.85rem;font-weight:700;
  color:var(--gold);cursor:pointer;padding:4px;
  transition:opacity .15s;white-space:nowrap;
}
.so-cancel:active{opacity:.6;}

/* Results area */
.so-results{
  flex:1;overflow-y:auto;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.so-results::-webkit-scrollbar{display:none;}

.so-section-head{
  font-size:0.62rem;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ghost);
  padding:0 4px 10px;margin-top:16px;
}
.so-section-head:first-child{margin-top:4px;}

.so-item{
  display:flex;align-items:center;gap:14px;
  padding:13px 12px;border-radius:14px;
  cursor:pointer;transition:background .12s;
  margin-bottom:2px;
}
.so-item:active{background:rgba(240,180,41,0.08);}
.so-item.focused{background:rgba(240,180,41,0.07);}

.si-icon{
  width:40px;height:40px;border-radius:12px;
  background:var(--mid);border:1px solid var(--rim);
  display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;flex-shrink:0;
}
.si-body{flex:1;min-width:0;}
.si-name{
  font-size:0.92rem;font-weight:700;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.si-name mark{
  background:none;color:var(--gold);
  font-weight:800;
}
.si-sub{
  font-family:'DM Mono',monospace;
  font-size:0.62rem;color:var(--soft);margin-top:2px;
}
.si-pop{
  flex-shrink:0;font-family:'DM Mono',monospace;
  font-size:0.65rem;color:var(--ghost);text-align:right;
}
.si-arr{flex-shrink:0;color:var(--ghost);font-size:0.75rem;margin-left:4px;}

.so-loader{
  display:flex;align-items:center;gap:12px;
  padding:20px 12px;color:var(--ghost);font-size:0.85rem;
}
.so-empty{
  padding:40px 16px;text-align:center;
  color:var(--ghost);font-size:0.88rem;line-height:1.6;
}

/* ═══════════════════════════════════════════
   MAIN CHART AREA
═══════════════════════════════════════════ */
.chart-area{
  position:relative;z-index:1;
  flex:1;display:flex;flex-direction:column;
  overflow:hidden;min-height:0;
}

/* Level label — floats above pie */
.level-float{
  position:absolute;top:0;left:0;right:0;
  padding:6px 20px;
  display:flex;align-items:center;gap:8px;
  z-index:10;pointer-events:none;
}
.lf-tag{
  font-family:'DM Mono',monospace;
  font-size:0.58rem;font-weight:500;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ghost);
  background:var(--glass);
  border:1px solid var(--rim);
  border-radius:20px;padding:3px 10px;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}
.lf-name{
  font-family:'Fraunces',serif;
  font-size:0.95rem;font-weight:600;font-style:italic;
  color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  flex:1;
}

/* Breadcrumb — also floating */
.bc-float{
  position:absolute;top:32px;left:0;right:0;
  padding:4px 20px;
  display:flex;align-items:center;gap:5px;
  z-index:10;pointer-events:all;
  flex-wrap:wrap;
}
.bc-crumb{
  font-size:0.68rem;font-weight:500;color:var(--ghost);
  cursor:pointer;padding:2px 5px;border-radius:6px;
  transition:color .15s;
}
.bc-crumb:hover{color:var(--text);}
.bc-crumb.now{color:var(--gold);font-weight:700;cursor:default;}
.bc-sep{color:var(--rim+);font-size:0.75rem;}

/* PIE canvas — fills everything */
.pie-field{
  flex:1;min-height:0;
  display:flex;align-items:center;justify-content:center;
  position:relative;
}
canvas#pie{
  display:block;cursor:pointer;
  touch-action:manipulation;
  background:transparent;
}

/* Back button */
.back-btn{
  position:absolute;left:16px;
  top:50%;transform:translateY(-50%);
  width:42px;height:42px;border-radius:50%;
  background:var(--glass);
  border:1px solid var(--rim+);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  transition:all .25s cubic-bezier(0.34,1.4,0.64,1);
  opacity:0;pointer-events:none;z-index:10;
}
.back-btn.on{opacity:1;pointer-events:all;}
.back-btn:hover{background:var(--mid);border-color:var(--rim+);transform:translateY(-50%) scale(1.08);}
.back-btn:active{transform:translateY(-50%) scale(.93);}
.back-btn svg{width:18px;height:18px;fill:none;stroke:var(--text);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}

/* Donut center */
.donut-center{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  text-align:center;pointer-events:none;z-index:5;
  transition:all .3s;
}
.dc-city{
  font-family:'DM Mono',monospace;
  font-size:0.58rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ghost);margin-bottom:2px;
  transition:all .3s;
}
.dc-amount{
  font-family:'Fraunces',serif;
  font-size:clamp(1.1rem,6.5vw,1.8rem);
  font-weight:300;font-style:italic;
  color:var(--text);line-height:1;
  transition:all .3s;
}
.dc-amount strong{font-weight:600;color:var(--gold);}
.dc-sub{
  font-size:0.6rem;color:var(--ghost);margin-top:3px;
  font-family:'DM Mono',monospace;
}

/* ═══════════════════════════════════════════
   ITEMS STRIP — slides up from bottom
═══════════════════════════════════════════ */
.items-strip{
  position:relative;z-index:10;
  flex-shrink:0;
  padding-bottom:env(safe-area-inset-bottom,0px);
}

/* Anomaly bar */
.anom-bar{
  margin:0 16px 8px;
  background:rgba(255,107,107,0.1);
  border:1px solid rgba(255,107,107,0.25);
  border-radius:14px;padding:10px 14px;
  display:none;align-items:center;gap:10px;
  cursor:pointer;transition:all .18s;
}
.anom-bar.vis{display:flex;}
.anom-bar:active{transform:scale(.98);}
.anom-bar-l{flex:1;}
.anom-bar-title{font-size:0.85rem;font-weight:700;color:#ff9090;}
.anom-bar-sub{font-size:0.67rem;color:var(--soft);margin-top:1px;}
.anom-bar-cta{
  background:var(--ember);color:#fff;
  font-size:0.68rem;font-weight:700;
  padding:5px 12px;border-radius:20px;
  white-space:nowrap;flex-shrink:0;
}

/* Scroll container for items */
.items-scroll{
  display:flex;gap:10px;
  overflow-x:auto;padding:0 16px 16px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
  scroll-snap-type:x mandatory;
}
.items-scroll::-webkit-scrollbar{display:none;}

/* Each item card */
.icard{
  flex-shrink:0;
  width:clamp(140px,38vw,175px);
  background:var(--glass);
  border:1px solid var(--rim);
  border-radius:18px;
  padding:14px 14px 12px;
  cursor:pointer;
  scroll-snap-align:start;
  transition:all .2s cubic-bezier(0.34,1.2,0.64,1);
  backdrop-filter:blur(20px) saturate(160%);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  position:relative;overflow:hidden;
}
.icard::before{
  content:'';position:absolute;inset:0;border-radius:18px;
  background:linear-gradient(135deg,rgba(255,255,255,0.04) 0%,transparent 60%);
  pointer-events:none;
}
.icard:active{transform:scale(.95);}
.icard.anomaly{border-color:rgba(255,107,107,0.3);background:rgba(255,107,107,0.06);}

/* Color stripe top */
.icard-stripe{
  height:3px;border-radius:2px;
  margin-bottom:10px;
  background:var(--color,#fff);
  opacity:.7;
}
.icard-icon{font-size:1.2rem;margin-bottom:8px;display:block;}
.icard-name{
  font-size:0.78rem;font-weight:700;color:var(--text);
  line-height:1.3;
  /* 2 lines max */
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  min-height:2.2em;
  margin-bottom:8px;
}
.icard-pct{
  font-family:'Fraunces',serif;
  font-size:1.4rem;font-weight:600;font-style:italic;
  color:var(--text);line-height:1;
}
.icard-amt{
  font-family:'DM Mono',monospace;
  font-size:0.6rem;color:var(--soft);margin-top:2px;
}
.icard-badge{
  position:absolute;top:10px;right:10px;
  font-size:0.68rem;
}
.icard-drill{
  position:absolute;bottom:10px;right:10px;
  color:var(--ghost);font-size:0.7rem;
}

/* ═══════════════════════════════════════════
   DRAWER — bottom sheet
═══════════════════════════════════════════ */
.drawer{
  position:fixed;left:0;right:0;bottom:0;z-index:100;
  background:var(--deep);
  border-top:1px solid rgba(240,180,41,0.3);
  border-radius:22px 22px 0 0;
  transform:translateY(100%);
  transition:transform .42s cubic-bezier(0.22,1,0.36,1);
  max-height:78svh;display:flex;flex-direction:column;
  box-shadow:0 -24px 80px rgba(0,0,0,.75);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.drawer.on{transform:translateY(0);}

.drw-handle{
  width:36px;height:4px;border-radius:2px;
  background:var(--rim+);margin:12px auto 0;flex-shrink:0;
}
.drw-head{
  flex-shrink:0;padding:12px 20px 10px;
  display:flex;align-items:center;gap:10px;
}
.drw-color{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.drw-title{
  font-family:'Fraunces',serif;font-style:italic;
  font-size:1rem;font-weight:600;flex:1;color:var(--text);
}
.drw-amt{
  font-family:'DM Mono',monospace;font-size:0.8rem;
  color:var(--gold);flex-shrink:0;
}
.drw-x{
  background:none;border:none;color:var(--ghost);
  font-size:1.4rem;cursor:pointer;padding:0;
  width:30px;height:30px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;transition:background .15s;
}
.drw-x:hover{background:var(--mid);}

.drw-tabs{
  flex-shrink:0;display:flex;border-bottom:1px solid var(--rim);
  padding:0 20px;overflow-x:auto;scrollbar-width:none;
}
.drw-tabs::-webkit-scrollbar{display:none;}
.dtab{
  font-size:0.63rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:9px 14px;cursor:pointer;color:var(--ghost);
  border-bottom:2px solid transparent;margin-bottom:-1px;
  transition:all .15s;white-space:nowrap;flex-shrink:0;
}
.dtab.on{color:var(--gold);border-bottom-color:var(--gold);}

.drw-body{
  flex:1;overflow-y:auto;padding:18px 20px 24px;
  scrollbar-width:thin;scrollbar-color:var(--rim) transparent;
}
.drw-body::-webkit-scrollbar{width:2px;}
.drw-body::-webkit-scrollbar-thumb{background:var(--rim+);border-radius:2px;}
.dtc{display:none;}.dtc.on{display:block;}

/* Alert block */
.alert-blk{
  background:rgba(255,107,107,0.08);
  border:1px solid rgba(255,107,107,0.22);
  border-radius:14px;padding:14px;margin-bottom:16px;
  display:flex;gap:12px;
}
.ab-ico{font-size:1.1rem;flex-shrink:0;margin-top:1px;}
.ab-body{flex:1;}
.ab-title{font-size:0.85rem;font-weight:700;color:#ff9090;margin-bottom:4px;}
.ab-text{font-size:0.77rem;line-height:1.6;color:var(--soft);}
.ab-cta{
  margin-top:8px;font-size:0.7rem;
  color:var(--gold);font-weight:600;
  border-left:2px solid var(--gold);padding-left:8px;
}

/* Invoice rows */
.inv-row{
  background:var(--mid);border:1px solid var(--rim);
  border-radius:12px;padding:12px;margin-bottom:8px;
  display:flex;gap:10px;align-items:flex-start;
}
.inv-row.al{border-color:rgba(255,107,107,.3);background:rgba(255,107,107,.05);}
.inv-row.wn{border-color:rgba(255,140,90,.25);background:rgba(255,140,90,.04);}
.inv-num{font-family:'DM Mono',monospace;font-size:.58rem;color:var(--ghost);flex-shrink:0;min-width:78px;padding-top:1px;}
.inv-info{flex:1;min-width:0;}
.inv-desc{font-size:.8rem;font-weight:600;color:var(--text);}
.inv-sup{font-size:.66rem;color:var(--soft);margin-top:2px;}
.inv-note{font-size:.65rem;margin-top:4px;}
.inv-note.r{color:#ff9090;}.inv-note.a{color:var(--peach);}
.inv-amt{font-family:'DM Mono',monospace;font-size:.78rem;font-weight:500;flex-shrink:0;color:var(--text);}

/* Person cards */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;}
.pcard{
  background:var(--mid);border:1px solid var(--rim);
  border-radius:14px;padding:14px;
}
.pcard.al{border-color:rgba(255,107,107,.3);}
.pc-role{font-size:.58rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ghost);margin-bottom:4px;}
.pc-name{font-size:.82rem;font-weight:700;margin-bottom:7px;color:var(--text);}
.pc-sal{font-family:'DM Mono',monospace;font-size:.95rem;color:var(--gold);}
.pc-net{font-size:.62rem;color:var(--soft);margin-top:2px;}
.pc-base{font-size:.6rem;color:var(--ghost);margin-top:5px;font-family:'DM Mono',monospace;}
.pc-note{font-size:.62rem;margin-top:4px;color:#ff9090;}

/* Table */
.tbl{width:100%;border-collapse:collapse;font-size:.78rem;}
.tbl th{font-size:.56rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ghost);text-align:left;padding:6px 8px;border-bottom:1px solid var(--rim);font-weight:600;}
.tbl td{padding:9px 8px;border-bottom:1px solid rgba(255,255,255,.03);}
.tbl tr:last-child td{border-bottom:none;}
.tbl .r{text-align:right;font-family:'DM Mono',monospace;font-size:.74rem;}
.bdg{font-size:.58rem;font-weight:700;padding:2px 8px;border-radius:20px;}
.bdg-r{background:rgba(255,107,107,.14);color:#ff9090;}
.bdg-g{background:rgba(62,207,142,.1);color:var(--sage);}

/* Anomaly card in drawer */
.ac{background:var(--mid);border:1px solid var(--rim);border-radius:14px;overflow:hidden;margin-bottom:10px;}
.ac-head{padding:11px 14px;display:flex;align-items:center;gap:9px;font-size:.82rem;font-weight:700;}
.ac-head.h{background:rgba(255,107,107,.08);border-bottom:1px solid rgba(255,107,107,.12);}
.ac-head.m{background:rgba(255,140,90,.06);border-bottom:1px solid rgba(255,140,90,.1);}
.ac-tag{font-size:.57rem;font-weight:800;padding:2px 8px;border-radius:20px;flex-shrink:0;}
.ac-tag.h{background:var(--ember);color:#fff;}
.ac-tag.m{background:var(--peach);color:var(--ink);}
.ac-body{padding:10px 14px;font-size:.77rem;line-height:1.65;color:var(--soft);}
.ac-action{padding:9px 14px;border-top:1px solid var(--rim);font-size:.7rem;color:var(--gold);display:flex;gap:6px;background:rgba(240,180,41,.04);}
.ac-action::before{content:'→';}

/* Question item */
.qi{background:var(--mid);border:1px solid var(--rim);border-radius:12px;padding:12px 14px;margin-bottom:8px;}
.qi-tag{font-size:.58rem;font-weight:700;letter-spacing:.08em;color:var(--ember);margin-bottom:5px;}
.qi-q{font-size:.8rem;color:var(--text);line-height:1.55;font-style:italic;border-left:2px solid var(--gold);padding-left:10px;}
.qi-btn{margin-top:8px;background:none;border:1px solid var(--rim+);color:var(--soft);font-size:.62rem;font-weight:700;padding:5px 13px;border-radius:20px;cursor:pointer;transition:all .15s;}
.qi-btn:hover{background:var(--gold);color:var(--ink);border-color:var(--gold);}

/* AI */
.aib{background:var(--mid);border:1px solid var(--rim);border-radius:14px;overflow:hidden;}
.aib-h{padding:10px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--rim);}
.aib-h span{font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ghost);}
.aib-tag{background:rgba(255,107,107,.18);color:var(--ember);border:1px solid rgba(255,107,107,.25);font-size:.57rem;font-weight:700;padding:2px 8px;border-radius:20px;margin-left:auto;}
.aib-body{padding:14px;font-size:.8rem;line-height:1.7;}
.ai-v{border-left:3px solid var(--sage);background:rgba(62,207,142,.06);border-radius:0 8px 8px 0;padding:9px 12px;margin:7px 0;}
.ai-w{border-left:3px solid var(--peach);background:rgba(255,140,90,.06);border-radius:0 8px 8px 0;padding:9px 12px;margin:7px 0;}
.ai-q{border-left:3px solid var(--gold);background:rgba(240,180,41,.06);border-radius:0 8px 8px 0;padding:9px 12px;margin:7px 0;}
.aib-acts{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--rim);flex-wrap:wrap;}
.ai-btn{background:var(--lift);border:1px solid var(--rim+);color:var(--soft);font-size:.62rem;font-weight:600;padding:6px 13px;border-radius:20px;cursor:pointer;transition:all .15s;}
.ai-btn:hover{background:var(--mid);color:var(--text);}
.ai-btn.d{border-color:rgba(255,107,107,.3);color:#ff9090;}

/* Dots loader */
.dots span{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--gold);margin-right:3px;animation:db 1.2s ease-in-out infinite;}
.dots span:nth-child(2){animation-delay:.2s;}.dots span:nth-child(3){animation-delay:.4s;}
@keyframes db{0%,80%,100%{transform:scale(.55);opacity:.25;}40%{transform:scale(1);opacity:1;}}

/* Loading overlay — over pie */
.loading-overlay{
  position:absolute;inset:0;z-index:20;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:rgba(6,16,29,.75);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border-radius:12px;opacity:0;pointer-events:none;transition:opacity .3s;
}
.loading-overlay.on{opacity:1;pointer-events:all;}
.loading-overlay .lo-text{font-size:.8rem;color:var(--soft);font-weight:600;}
.loading-overlay .lo-err{color:var(--ember);font-size:.75rem;text-align:center;max-width:80%;}

/* Overlay */
.overlay{position:fixed;inset:0;background:rgba(6,16,29,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:90;opacity:0;pointer-events:none;transition:opacity .3s;}
.overlay.on{opacity:1;pointer-events:all;}

/* Toast */
#toast{
  position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);
  left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--mid);border:1px solid var(--rim+);
  border-radius:24px;padding:9px 18px;
  font-size:.75rem;font-weight:600;color:var(--soft);
  z-index:300;opacity:0;
  transition:transform .35s cubic-bezier(.34,1.56,.64,1),opacity .25s;
  white-space:nowrap;pointer-events:none;
  box-shadow:0 8px 32px rgba(0,0,0,.5);
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0);}

let ROOT = makeRoot('Cambrai');

let hiIdx = -1;
let currentCity = null;
let animRaf;
const cur = () => nav[nav.length-1];

// ═══════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════
function render(anim=true){
  const node = cur();
  const items = node.children||[];
  const total = items.reduce((a,b)=>a+b.value,0);

  // Floating labels
  const depth = nav.length-1;
  const tagLabels = ['Budget communal','Catégories','Services · Personnel','Grades · Échelons'];
  document.getElementById('lf-tag').textContent = tagLabels[Math.min(depth,3)];
  const nameEl = document.getElementById('lf-name');
  if(depth>0){ nameEl.textContent=node.label; nameEl.style.display='block'; }
  else{ nameEl.style.display='none'; }

  // Center
  if(currentCity){
    document.getElementById('dc-city').textContent = currentCity.nom;
    document.getElementById('dc-amount').innerHTML = `<strong>${fmt(total||node.value)}</strong>`;
    document.getElementById('dc-sub').textContent = depth===0?'budget total':'sous-total';
  }

  // Back
  document.getElementById('back-btn').classList.toggle('on', nav.length>1);

  // Anomaly bar
  const anomItems = items.filter(i=>i.anomaly);
  const abar = document.getElementById('anom-bar');
  if(anomItems.length){ abar.classList.add('vis'); document.getElementById('anom-count').textContent=anomItems.length; }
  else { abar.classList.remove('vis'); }

  buildBC();
  drawPie(items,total,anim);
  buildCards(items,total);
}

// ═══════════════════════════════════════════
//  PIE — pure canvas, no labels
// ═══════════════════════════════════════════
function drawPie(items,total,anim){
  const field = document.getElementById('pie-field');
  const cv = document.getElementById('pie');
  const dpr = devicePixelRatio||1;
  const W=field.clientWidth, H=field.clientHeight;

  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  cv.style.width=W+'px'; cv.style.height=H+'px';

  // Size donut center overlay
  const IR_ratio = 0.28;
  const R_val = Math.min(W/2,H/2)*0.88;
  const holePx = R_val*IR_ratio*2;
  const dc=document.getElementById('donut-center');
  dc.style.width=holePx+'px'; dc.style.height=holePx+'px';

  const ctx=cv.getContext('2d');
  ctx.scale(dpr,dpr);

  if(!items.length){ ctx.clearRect(0,0,W,H); drawEmptyPie(ctx,W,H); return; }

  const cx=W/2, cy=H/2;
  const R=Math.min(W/2,H/2)*0.88;
  const IR=R*0.28;
  const gap=items.length>7?0.007:0.012;

  const slices=[];
  let sa=-Math.PI/2;
  items.forEach((item,i)=>{
    const sw=(item.value/total)*(2*Math.PI-gap*items.length);
    const color=item.color||COLORS[i%COLORS.length];
    slices.push({sa,ea:sa+sw,i,item,color});
    sa+=sw+gap;
  });
  slices.forEach(s=>s.mid=(s.sa+s.ea)/2);
  cv._s=slices; cv._m={cx,cy,R,IR};

  let p=anim?0:1;

  function paint(prog){
    ctx.clearRect(0,0,W,H);
    slices.forEach(sl=>{
      const act=hiIdx===sl.i;
      const bump=act?R*0.04:0;
      const mid=sl.mid;
      const psa=-Math.PI/2+(sl.sa+Math.PI/2)*prog;
      const pea=-Math.PI/2+(sl.ea+Math.PI/2)*prog;

      ctx.save();
      if(act){
        ctx.translate(Math.cos(mid)*bump,Math.sin(mid)*bump);
        ctx.shadowColor=sl.color+'80';
        ctx.shadowBlur=R*0.08;
      }
      ctx.beginPath();
      ctx.moveTo(cx,cy);
      ctx.arc(cx,cy,act?R*1.04:R,psa,pea);
      ctx.closePath();
      ctx.fillStyle=sl.color+(sl.item.anomaly?'bb':'ee');
      ctx.fill();
      ctx.shadowBlur=0;

      // anomaly hatch
      if(sl.item.anomaly&&prog>0.9){
        ctx.save();ctx.clip();
        ctx.strokeStyle='rgba(255,107,107,0.18)';ctx.lineWidth=R*0.03;
        for(let x=-W;x<W*2;x+=W*0.05){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+H,H);ctx.stroke();}
        ctx.restore();
      }
      ctx.strokeStyle=act?'rgba(255,255,255,0.7)':'rgba(6,16,29,0.45)';
      ctx.lineWidth=act?2:1;
      ctx.stroke();
      ctx.restore();
    });

    // hole
    ctx.beginPath();ctx.arc(cx,cy,IR,0,2*Math.PI);
    ctx.fillStyle='#06101d';ctx.fill();
    // subtle rim
    ctx.strokeStyle='rgba(255,255,255,0.05)';ctx.lineWidth=1.5;ctx.stroke();
  }

  if(anim){
    const t0=performance.now(),dur=640;
    const frame=now=>{
      const raw=(now-t0)/dur;
      paint(Math.min(1,1-Math.pow(1-raw,3)));
      if(raw<1)animRaf=requestAnimationFrame(frame);
    };
    if(animRaf)cancelAnimationFrame(animRaf);
    requestAnimationFrame(frame);
  }else{paint(1);}
}

function drawEmptyPie(ctx,W,H){
  // Beautiful empty state — glowing rings
  const cx=W/2,cy=H/2;
  const R=Math.min(W,H)*0.38;
  for(let i=3;i>0;i--){
    ctx.beginPath();ctx.arc(cx,cy,R*(0.6+i*0.15),0,2*Math.PI);
    ctx.strokeStyle=`rgba(91,156,246,${0.04*i})`;ctx.lineWidth=R*0.12;ctx.stroke();
  }
  ctx.beginPath();ctx.arc(cx,cy,R*0.28,0,2*Math.PI);
  ctx.fillStyle='rgba(91,156,246,0.04)';ctx.fill();
}

// ═══════════════════════════════════════════
//  CARDS
// ═══════════════════════════════════════════
function buildCards(items,total){
  const scroll=document.getElementById('items-scroll');
  scroll.innerHTML='';
  if(!items.length)return;

  items.forEach((item,i)=>{
    const pct=((item.value/total)*100).toFixed(1);
    const color=item.color||COLORS[i%COLORS.length];
    const card=document.createElement('div');
    card.className='icard'+(item.anomaly?' anomaly':'');
    card.style.setProperty('--color',color);

    const drill=item.isGrade?`${item.nb} ag.`:item.leaf?'📋':item.children?.length?'›':'';

    card.innerHTML=`
      <div class="icard-stripe" style="background:${color}"></div>
      <div class="icard-icon">${ico(item.label)}</div>
      <div class="icard-name">${item.label}</div>
      <div class="icard-pct">${pct}%</div>
      <div class="icard-amt">${fmt(item.value)}</div>
      ${item.anomaly?`<div class="icard-badge">🚨</div>`:''}
      ${drill?`<div class="icard-drill">${drill}</div>`:''}
    `;
    card.addEventListener('click',()=>clickItem(i));
    // touch highlight synced to pie
    card.addEventListener('touchstart',()=>{hiIdx=i;redraw();},{passive:true});
    card.addEventListener('touchend',()=>{hiIdx=-1;redraw();},{passive:true});
    scroll.appendChild(card);
  });
}

function redraw(){
  const n=cur(),items=n.children||[];
  drawPie(items,items.reduce((a,b)=>a+b.value,0),false);
}

// ═══════════════════════════════════════════
//  BREADCRUMB
// ═══════════════════════════════════════════
function buildBC(){
  const el=document.getElementById('bc-float');el.innerHTML='';
  if(nav.length<=1)return;
  nav.forEach((node,i)=>{
    if(i){const s=document.createElement('span');s.className='bc-sep';s.textContent='›';el.appendChild(s);}
    const d=document.createElement('div');
    d.className='bc-crumb'+(i===nav.length-1?' now':'');
    d.textContent=i===0?(currentCity?.nom||'Budget'):node.label;
    if(i<nav.length-1){const idx=i;d.addEventListener('click',()=>{nav.splice(idx+1);hiIdx=-1;closeDrawer();render(true);});}
    el.appendChild(d);
  });
}

// ═══════════════════════════════════════════
//  CANVAS HIT TEST
// ═══════════════════════════════════════════
function hit(e){
  const cv=document.getElementById('pie');if(!cv._s)return-1;
  const r=cv.getBoundingClientRect();
  const px=(e.clientX-r.left)*(cv.width/r.width)/devicePixelRatio;
  const py=(e.clientY-r.top)*(cv.height/r.height)/devicePixelRatio;
  const{cx,cy,R,IR}=cv._m;
  const dx=px-cx,dy=py-cy,dist=Math.sqrt(dx*dx+dy*dy);
  if(dist<IR||dist>R*1.07)return-1;
  const a=Math.atan2(dy,dx);
  for(const sl of cv._s){
    if(a>=sl.sa&&a<=sl.ea)return sl.i;
    if(a+2*Math.PI>=sl.sa&&a+2*Math.PI<=sl.ea)return sl.i;
  }
  return-1;
}

const PIE=document.getElementById('pie');
PIE.addEventListener('touchstart',e=>{const t=e.changedTouches[0];const idx=hit(t);if(idx>=0){hiIdx=idx;redraw();}},{passive:true});
PIE.addEventListener('touchend',e=>{e.preventDefault();const t=e.changedTouches[0];const idx=hit(t);hiIdx=-1;redraw();if(idx>=0)clickItem(idx);});
PIE.addEventListener('click',e=>{const idx=hit(e);if(idx>=0)clickItem(idx);});
PIE.addEventListener('mousemove',e=>{const idx=hit(e);if(idx!==hiIdx){hiIdx=idx;redraw();}PIE.style.cursor=idx>=0?'pointer':'default';});
PIE.addEventListener('mouseleave',()=>{hiIdx=-1;redraw();PIE.style.cursor='default';});
window.addEventListener('resize',()=>render(false));
document.addEventListener('keydown',e=>{if((e.key==='Escape'||e.key==='Backspace')&&document.activeElement.tagName!=='INPUT'){if(searchIsOpen())closeSearch();else goBack();}});

// ═══════════════════════════════════════════
//  CLICK
// ═══════════════════════════════════════════
function clickItem(idx){
  const node=cur(),item=node.children[idx];
  if(!item)return;
  if(item.leaf){openDrawer(item);return;}
  if(item.children?.length){nav.push(item);hiIdx=-1;closeDrawer();render(true);return;}
  openDrawer(item);
}

const RECENT_KEY='tr_recent_v2';
const getRecent=()=>{ try{return JSON.parse(localStorage.getItem(RECENT_KEY)||'[]');}catch{return[];} };
const saveRecent=city=>{ let r=getRecent().filter(c=>c.code!==city.code);r.unshift(city);r=r.slice(0,6);try{localStorage.setItem(RECENT_KEY,JSON.stringify(r));}catch{} };
const searchIsOpen=()=>document.getElementById('search-overlay').classList.contains('open');

let searchTimer=null, soResults=[], soFocus=-1;

function openSearch(){
  const ov=document.getElementById('search-overlay');
  ov.classList.add('open');
  setTimeout(()=>{ document.getElementById('so-input').focus(); },80);
  showRecentResults();
}

function closeSearch(){
  document.getElementById('search-overlay').classList.remove('open');
  document.getElementById('so-input').blur();
}

function clearSO(){
  const inp=document.getElementById('so-input');
  inp.value='';
  document.getElementById('so-clear').classList.remove('vis');
  soResults=[];soFocus=-1;
  showRecentResults();
  inp.focus();
}

const soInp=document.getElementById('so-input');
soInp.addEventListener('input',()=>{
  const q=soInp.value.trim();
  document.getElementById('so-clear').classList.toggle('vis',q.length>0);
  if(q.length===0){showRecentResults();return;}
  if(q.length<2)return;
  clearTimeout(searchTimer);
  searchTimer=setTimeout(()=>searchGeo(q),200);
});
soInp.addEventListener('keydown',e=>{
  const items=document.querySelectorAll('.so-item');
  if(e.key==='ArrowDown'){e.preventDefault();soFocus=Math.min(soFocus+1,items.length-1);items.forEach((el,i)=>el.classList.toggle('focused',i===soFocus));}
  else if(e.key==='ArrowUp'){e.preventDefault();soFocus=Math.max(soFocus-1,0);items.forEach((el,i)=>el.classList.toggle('focused',i===soFocus));}
  else if(e.key==='Enter'){e.preventDefault();if(soFocus>=0&&soResults[soFocus])pickCity(soResults[soFocus]);else if(soResults[0])pickCity(soResults[0]);}
});

function showRecentResults(){
  const r=getRecent();
  const el=document.getElementById('so-results');
  if(!r.length){
    el.innerHTML=`<div class="so-empty">
      <div style="font-size:2.5rem;margin-bottom:12px">🔍</div>
      Tapez le nom de votre commune<br>
      <span style="font-size:.75rem;color:var(--ghost);margin-top:6px;display:block">35 357 communes disponibles</span>
    </div>`;
    soResults=[]; return;
  }
  el.innerHTML=`<div class="so-section-head">Dernières recherches</div>`+r.map((c,i)=>soItemHTML(c,i,'🕐')).join('');
  soResults=r;
  bindSOItems();
}

async function searchGeo(q){
  const el=document.getElementById('so-results');
  el.innerHTML=`<div class="so-loader"><div class="dots"><span></span><span></span><span></span></div>Recherche…</div>`;
  try{
    const res=await fetch(`https://geo.api.gouv.fr/communes?nom=${encodeURIComponent(q)}&fields=nom,code,codesPostaux,codeDepartement,departement,population&boost=population&limit=8`);
    const data=await res.json();
    if(!data.length){el.innerHTML=`<div class="so-empty">Aucune commune trouvée pour <strong>"${q}"</strong></div>`;soResults=[];return;}
    soResults=data.map(c=>({nom:c.nom,code:c.code,dept:c.departement?.nom||c.codeDepartement,deptNum:c.codeDepartement,cp:c.codesPostaux?.[0]||'',pop:c.population||0}));
    el.innerHTML=`<div class="so-section-head">${data.length} résultat${data.length>1?'s':''}</div>`+soResults.map((c,i)=>soItemHTML(c,i,cityEmoji(c.pop),q)).join('');
    soFocus=-1;bindSOItems();
  }catch{
    el.innerHTML=`<div class="so-empty">⚠ Erreur réseau<br><span style="font-size:.75rem">Vérifiez votre connexion</span></div>`;
  }
}

function soItemHTML(c,i,emo,q=''){
  const name=q?c.nom.replace(new RegExp(q,'gi'),m=>`<mark>${m}</mark>`):c.nom;
  return`<div class="so-item" data-idx="${i}">
    <div class="si-icon">${emo}</div>
    <div class="si-body">
      <div class="si-name">${name}</div>
      <div class="si-sub">${c.dept||''} ${c.deptNum?'('+c.deptNum+')':''} · ${c.cp}</div>
    </div>
    <div class="si-pop">${fmtPop(c.pop)}</div>
    <div class="si-arr">›</div>
  </div>`;
}

function bindSOItems(){
  document.querySelectorAll('.so-item').forEach(el=>{
    el.addEventListener('click',()=>{
      const idx=parseInt(el.dataset.idx);
      if(soResults[idx])pickCity(soResults[idx]);
    });
  });
}

function pickCity(city){
  saveRecent(city);
  closeSearch();
  loadCityData(city);
}

// ═══════════════════════════════════════════
//  BUILD TREE FROM API RESPONSE
// ═══════════════════════════════════════════
function buildTreeFromAPI(d){
  const C=COLORS;
  const chapEntries=Object.entries(d.chapitres||{});
  const chapChildren=chapEntries.map(([code,ch],i)=>({
    label:ch.lib||`Chapitre ${code}`,
    value:ch.depense||0,
    color:C[i%C.length],
    leaf:true,
    ltype:'inv',
    data:{m:`CHAP-${code}`,a:'DGFIP',p:'Comptabilité M14',inv:[]},
  }));

  const marchesChildren=(d.marches||[]).filter(m=>m.montant>0).map((m,i)=>({
    label:m.objet||m.ref||'Marché',
    value:m.montant,
    color:C[(i+2)%C.length],
    leaf:true,
    ltype:'inv',
    data:{m:m.ref,a:m.attributaire,p:m.procedure,inv:[
      {n:m.ref,d:m.objet,s:m.attributaire,v:m.montant,dt:m.date,f:'ok'},
    ]},
  }));

  const subvChildren=(d.subventions||[]).filter(s=>s.montant>0).map((s,i)=>({
    label:s.beneficiaire||'Association',
    value:s.montant,
    color:C[(i+4)%C.length],
    leaf:true,
    ltype:'pers',
    data:{role:s.beneficiaire,grade:s.objet||'',brut:fmtEur(s.montant),net:'',base:`Convention ${s.annee||''}`,note:''},
  }));

  const children=[];
  if(chapChildren.length) children.push({label:'Budget par chapitres',value:chapChildren.reduce((a,c)=>a+c.value,0),color:C[0],children:chapChildren});
  if(marchesChildren.length) children.push({label:'Marchés publics',value:marchesChildren.reduce((a,c)=>a+c.value,0),color:C[3],children:marchesChildren});
  if(subvChildren.length) children.push({label:'Subventions',value:subvChildren.reduce((a,c)=>a+c.value,0),color:C[4],children:subvChildren});

  // Anomalies → inject into relevant nodes
  const anomalies=d.anomalies_auto||[];
  for(const an of anomalies){
    if(an.type==='ratio_personnel_eleve'){
      const ch012=chapChildren.find(c=>c.label.includes('personnel'));
      if(ch012) ch012.anomaly=`⚠ Ratio ${an.valeur}% > seuil ${an.seuil}%`;
    }
    if(an.type==='marche_reconduit'){
      const mc=marchesChildren.find(c=>c.data?.a?.toLowerCase()===an.attributaire);
      if(mc) mc.anomaly=`⚠ Reconduit ${an.nombre} fois`;
    }
  }

  return{
    label:`Budget ${d.nom} ${d.annee||2023}`,
    value:d.budget_total||children.reduce((a,c)=>a+c.value,0),
    cityName:d.nom,
    children,
    kpis:d.kpis,
    anomalies_auto:anomalies,
  };
}

function fmtEur(v){return new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(v);}

//  LOAD CITY — async with API call
// ═══════════════════════════════════════════
async function loadCityData(city){
  currentCity=city;
  closeDrawer();

  // Update search pill immediately
  document.getElementById('sp-label').textContent=city.nom;
  document.getElementById('sp-label').classList.add('has-city');
  const deptEl=document.getElementById('sp-dept');
  deptEl.textContent=city.deptNum;
  deptEl.style.display='';

  // Show loader
  const lo=document.getElementById('loading-overlay');
  const loTxt=document.getElementById('lo-text');
  loTxt.textContent=`Chargement des données DGFIP…`;
  loTxt.classList.remove('lo-err');
  lo.classList.add('on');

  try{
    const res=await fetch(`/api/commune?insee=${city.code}`);
    if(!res.ok) throw new Error(`Erreur ${res.status}`);
    const data=await res.json();
    if(data.error) throw new Error(data.error);

    ROOT=buildTreeFromAPI(data);
    nav=[ROOT];hiIdx=-1;

    const anomCount=(data.anomalies_auto||[]).length;
    document.getElementById('alert-badge').style.display=anomCount?'flex':'none';
    document.getElementById('alert-num').textContent=String(anomCount);

    lo.classList.remove('on');
    render(true);
    showToast(`📊 Données DGFIP ${data.annee||2023} · ${city.nom}`);
  }catch(err){
    console.error('loadCityData error:', err);
    // Fallback: données fictives avec anomalies structurées
    loTxt.innerHTML=`<span class="lo-err">⚠ ${err.message}<br>Chargement des données de démo…</span>`;
    setTimeout(()=>{
      ROOT=makeRoot(city.nom);
      ROOT.anomalies_auto=DEMO_ANOMALIES_AUTO;
      nav=[ROOT];hiIdx=-1;
      const n=DEMO_ANOMALIES_AUTO.length;
      document.getElementById('alert-badge').style.display='flex';
      document.getElementById('alert-num').textContent=String(n);
      lo.classList.remove('on');
      render(true);
      showToast(`📊 Données de démo · ${city.nom}`);
    },1500);
  }
}

function openDrawer(node){
  document.getElementById('drw-color').style.background=node.color||'#f0b429';
  document.getElementById('drw-title').textContent=node.label;
  document.getElementById('drw-amt').textContent=fmt(node.value);

  let tabs,html;
  if(node.isGrade&&node.persons){
    tabs=[['ag','👥 Agents'],['lg','Légal'],['ai','🤖 IA']];
    html=[buildAgents(node),buildLegal(node),buildAI(node)];
  }else if(node.ltype==='inv'){
    tabs=[['fac','📄 Factures'],['mp','Marché'],['ai','🤖 IA']];
    html=[buildInvs(node),buildMarche(node),buildAI(node)];
  }else if(node.ltype==='pers'){
    tabs=[['inf','ℹ️ Info'],['ai','🤖 IA']];
    html=[buildPersInfo(node),buildAI(node)];
  }else{
    tabs=[['dt','Détail'],['ai','🤖 IA']];
    html=[buildGeneric(node),buildAI(node)];
  }

  document.getElementById('drw-tabs').innerHTML=tabs.map((t,i)=>`<div class="dtab${i===0?' on':''}" onclick="switchTab('${t[0]}')" data-id="${t[0]}">${t[1]}</div>`).join('');
  document.getElementById('drw-body').innerHTML=html.map((h,i)=>`<div class="dtc${i===0?' on':''}" id="dtc-${tabs[i][0]}">${h}</div>`).join('');

  document.getElementById('drawer').classList.add('on');
  document.getElementById('overlay').classList.add('on');
  const aib=document.getElementById('ai-out');
  if(aib)runAI(node,aib);
}

function aBlk(txt){
  if(!txt)return'';
  const h=txt.includes('🚨');
  return`<div class="alert-blk">
    <div class="ab-ico">${h?'🚨':'⚠️'}</div>
    <div class="ab-body">
      <div class="ab-title">${txt.replace(/^[🚨⚠️]\s*/,'')}</div>
      <div class="ab-cta">Demandez les pièces justificatives au prochain conseil municipal.</div>
    </div>
  </div>`;
}

function buildAgents(node){
  return aBlk(node.anomaly||'')+`
    <p style="font-size:.72rem;color:var(--soft);margin-bottom:12px">${node.nb||1} agent(s) · grade : <strong style="color:var(--gold)">${node.grade}</strong></p>
    <div class="pgrid">${(node.persons||[]).map(p=>`
      <div class="pcard${p.note?.includes('🚨')||p.note?.includes('⚠')?' al':''}">
        <div class="pc-role">${p.grade}</div>
        <div class="pc-name">${p.name}</div>
        <div class="pc-sal">${p.brut}</div>
        <div class="pc-net">${p.net} net estimé</div>
        <div class="pc-base">${p.base}</div>
        ${p.note?`<div class="pc-note">${p.note}</div>`:''}
      </div>`).join('')}</div>`;
}

function buildLegal(node){
  const p=(node.persons||[])[0]||{};
  return`<table class="tbl"><tbody>
    <tr><td style="color:var(--soft);font-size:.74rem;width:120px">Grade</td><td><strong style="color:var(--gold)">${node.grade}</strong></td></tr>
    <tr><td style="color:var(--soft);font-size:.74rem">Effectif</td><td>${node.nb||1} agent(s)</td></tr>
    <tr><td style="color:var(--soft);font-size:.74rem">Base légale</td><td class="r">${p.base||'—'}</td></tr>
    <tr><td style="color:var(--soft);font-size:.74rem">Brut moyen</td><td><strong>${p.brut||'—'}</strong></td></tr>

function buildInvs(node){
  const d=node.data||{};
  return aBlk(node.anomaly||d.anomaly||'')+(d.inv||[]).map(iv=>`

      <div class="inv-amt">${fmt(iv.v)}</div>

}

function buildMarche(node){
  const d=node.data||{};
  return`<table class="tbl"><tbody>
    <tr><td style="color:var(--soft);font-size:.74rem;width:100px">Référence</td><td class="r">${d.m||'—'}</td></tr>
    <tr><td style="color:var(--soft);font-size:.74rem">Attributaire</td><td><strong>${d.a||'—'}</strong></td></tr>
    <tr><td style="color:var(--soft);font-size:.74rem">Procédure</td><td>${d.p||'—'}</td></tr>
    <tr><td style="color:var(--soft);font-size:.74rem">Montant total</td><td><strong style="color:var(--gold)">${fmt(node.value)}</strong></td></tr>

function buildPersInfo(node){
  const d=node.data||{};
  return aBlk(node.anomaly||'')+`<div class="pgrid">
    <div class="pcard${node.anomaly?' al':''}">
      <div class="pc-role">${d.role||'—'}</div>
      <div class="pc-name">${node.label}</div>

function buildGeneric(node){
  const items=node.children||[];
  const total=items.reduce((a,b)=>a+b.value,0);
  return aBlk(node.anomaly||'')+`<table class="tbl">
    <thead><tr><th>Poste</th><th>Montant</th><th>Part</th><th></th></tr></thead>
    <tbody>${items.map(it=>`<tr>
      <td>${it.label}</td>
      <td class="r">${fmt(it.value)}</td>
      <td class="r">${((it.value/total)*100).toFixed(1)}%</td>
      <td>${it.anomaly?`<span class="bdg bdg-r">⚠</span>`:`<span class="bdg bdg-g">✓</span>`}</td>
    </tr>`).join('')}</tbody></table>`;
}

// ── Sanitation HTML pour données issues de l'API ──────────
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

// ── Rendu d'une anomalie → carte HTML ─────────────────────
function anomalyCard(an){
  const h=an.severite==='error';
  let titre='',corps='',action='';
  switch(an.type){
    case'ratio_personnel_eleve':
      titre=`Charges de personnel : ${esc(an.valeur)}% du budget`;
      corps=`Les charges de personnel représentent <strong>${esc(an.valeur)}%</strong> des dépenses, au-dessus du seuil d'alerte de ${esc(an.seuil)}%. La moyenne nationale est d'environ 33%.`;
      action='Demandez le tableau des effectifs et le détail des avancements de grade sur les 3 dernières années.';
      break;
    case'dette_elevee':
      titre=`Endettement : ${esc(an.valeur)} €/habitant`;
      corps=`La dette représente <strong>${esc(an.valeur)} €/habitant</strong>, au-dessus du seuil d'alerte de ${esc(an.seuil)} €. La moyenne nationale est d'environ 800 €/habitant pour les communes de taille comparable.`;
      action="Demandez le tableau d'amortissement complet de chaque emprunt et les conditions de renégociation possibles.";
      break;
    case'investissement_faible':
      titre=`Investissement faible : ${esc(an.valeur)}% du budget`;
      corps=`Le taux d'investissement est de <strong>${esc(an.valeur)}%</strong>, en dessous du seuil de ${esc(an.seuil)}%. Un sous-investissement chronique dégrade le patrimoine communal à moyen terme.`;
      action="Demandez le plan pluriannuel d'investissement (PPI) et l'état du patrimoine communal.";
      break;
    case'marche_mapa_seuil':
      titre=`Marché MAPA dépassant le seuil légal${an.attributaire?' — '+esc(an.attributaire):''}`;
      corps=`Un marché de <strong>${fmt(an.valeur)}</strong> a été passé en procédure adaptée (MAPA) alors que le seuil imposant un appel d'offres formalisé pour les collectivités est de ${fmt(an.seuil)} HT.${an.objet?' Objet : '+esc(an.objet)+'.':''}`;
      action='Demandez les 3 devis reçus, les critères de sélection et la notification de rejet aux candidats non retenus.';
      break;
    case'marche_reconduit':
      titre=`Marché reconduit ${esc(an.nombre)} fois — ${esc(an.attributaire)}`;
      corps=`Le prestataire <strong>"${esc(an.attributaire)}"</strong> remporte ${esc(an.nombre)} marchés. Au-delà de ${esc(an.seuil)} reconductions sans remise en concurrence, le risque de favoritisme augmente significativement.`;
      action='Demandez les cahiers des charges et les offres reçues pour chaque reconduction de ce prestataire.';
      break;
    default:
      // Anomalies riches (mode démo ou types futurs avec titre/corps pré-remplis)
      titre=an.titre||esc(an.type);
      corps=an.detail||'';
      action=an.action||'Demandez les pièces justificatives au prochain conseil municipal.';
  }
  return`<div class="ac">
    <div class="ac-head ${h?'h':'m'}"><span class="ac-tag ${h?'h':'m'}">${h?'ALERTE':'ATTENTION'}</span>${titre}</div>
    <div class="ac-body">${corps}</div>
    <div class="ac-action">${action}</div>
  </div>`;
}

// ── Rendu d'une anomalie → question CM ────────────────────
function anomalyQuestion(an){
  const h=an.severite==='error';
  let tag='',q='';
  switch(an.type){
    case'ratio_personnel_eleve':
      tag=`⚠️ Charges de personnel`;
      q=`Les charges de personnel représentent ${an.valeur}% du budget, au-dessus de la moyenne nationale. Pouvez-vous présenter l'évolution des effectifs et des grades sur les 3 dernières années ?`;
      break;
    case'dette_elevee':
      tag=`⚠️ Endettement`;
      q=`La dette par habitant atteint ${an.valeur} €, supérieure au seuil d'alerte de ${an.seuil} €. Présentez le tableau d'amortissement complet et les conditions de renégociation possibles.`;
      break;
    case'investissement_faible':
      tag=`⚠️ Investissement`;
      q=`Le taux d'investissement est de ${an.valeur}% du budget. Quel est l'état du plan pluriannuel d'investissement et comment la commune prévoit-elle de maintenir son patrimoine ?`;
      break;
    case'marche_mapa_seuil':
      tag=`🚨 Procédure marchés`;
      q=`Un marché de ${fmt(an.valeur)}${an.objet?' ('+an.objet+')':''} a été passé en MAPA alors que le seuil légal est de ${fmt(an.seuil)} HT. Qui étaient les candidats et quels étaient les critères de sélection ?`;
      break;
    case'marche_reconduit':
      tag=`⚠️ Marché — ${an.attributaire}`;
      q=`Le prestataire "${an.attributaire}" apparaît ${an.nombre} fois dans les marchés publics. Quelles procédures de mise en concurrence ont été appliquées à chaque reconduction ?`;
      break;
    default:
      tag=`${h?'🚨':'⚠️'} ${an.titre?an.titre.substring(0,40):an.type}`;
      q=an.question||`Une anomalie a été détectée sur ce poste. Pouvez-vous fournir les pièces justificatives complètes ?`;
  }
  // Échappement JS pour l'attribut onclick
  const qJs=q.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"');
  return`<div class="qi">
    <div class="qi-tag">${tag}</div>
    <div class="qi-q">"${esc(q)}"</div>
    <button class="qi-btn" onclick="navigator.clipboard?.writeText('${qJs}');this.textContent='✓ Copié !'">📋 Copier</button>
  </div>`;
}

function allAnomalies(){
  const anomalies=ROOT.anomalies_auto||[];
  if(!anomalies.length) return`<div class="so-empty" style="padding:30px 16px;text-align:center;color:var(--ghost)">
    <div style="font-size:2rem;margin-bottom:10px">✅</div>
    Aucune anomalie détectée<br>
    <span style="font-size:.72rem;margin-top:6px;display:block">Sur les données DGFIP et DECP disponibles</span>
  </div>`;
  return anomalies.map(anomalyCard).join('');
}

function allQuestions(){
  const anomalies=ROOT.anomalies_auto||[];
  if(!anomalies.length) return`<div class="so-empty" style="padding:30px 16px;text-align:center;color:var(--ghost)">
    Aucune question générée<br>
    <span style="font-size:.72rem;margin-top:6px;display:block">Les données ne révèlent pas d'anomalie à ce stade</span>
  </div>`;
  return anomalies.map(anomalyQuestion).join('');
}

// ═══════════════════════════════════════════
//  AI
// ═══════════════════════════════════════════
async function runAI(node,el){
  const anomaly=node.anomaly||node.data?.anomaly||'';
  const invs=(node.data?.inv||[]).map(i=>`${i.d}: ${fmt(i.v)}${i.note?' ['+i.note+']':''}`).join('\n');
  const pers=(node.persons||[]).map(p=>`${p.name}: ${p.brut}`).join('\n');
  const prompt=`Expert finances publiques françaises. Analyse ce poste pour un citoyen.
Commune: ${currentCity?.nom||'Cambrai'} · Budget 2022
Poste: ${node.label} — ${fmt(node.value)}
Anomalie: ${anomaly||'aucune'}
${invs?'Factures:\n'+invs:''}${pers?'\nPersonnel:\n'+pers:''}
Réponds en 3 blocs courts:
Verdict: [normal ou suspect ?]
Point d'attention: [risque principal ou rien si tout va bien]
Question CM: [question précise à poser en séance]`;

  try{
    const r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt})});
    const d=await r.json();
    const txt=d.text||'';
    el.innerHTML=txt.split('\n').filter(l=>l.trim()).map(l=>{
      const c=l.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
      if(l.toLowerCase().startsWith('verdict'))return`<div class="ai-v">${c}</div>`;
      if(l.toLowerCase().startsWith('point'))return`<div class="ai-w">${c}</div>`;
      if(l.toLowerCase().startsWith('question'))return`<div class="ai-q">${c}</div>`;
      return`<p style="margin:5px 0;font-size:.8rem;color:var(--soft)">${c}</p>`;
    }).join('');
  }catch{
    el.innerHTML=`<div class="ai-v">Verdict : ${anomaly?'Ce poste présente une anomalie à investiguer.':'Montant cohérent pour une commune de cette taille.'}</div>
    ${anomaly?`<div class="ai-w">Point d'attention : ${anomaly}</div>`:''}
    <div class="ai-q">Question CM : Demandez les pièces justificatives complètes pour ce poste.</div>`;
  }
}
